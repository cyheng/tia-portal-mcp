name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: 离线测试
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: 还原测试项目
        run: dotnet restore .\tests\TiaMcpServer.Tests\TiaMcpServer.Tests.csproj
      - name: 运行离线测试
        run: dotnet run --project .\tests\TiaMcpServer.Tests\TiaMcpServer.Tests.csproj -c Release --no-restore
      - name: 检查文档和发布脚本
        shell: pwsh
        run: |
          $required = @(
            "README.md",
            "skill/SKILL.md",
            "doc/development.md",
            "doc/architecture.md",
            "scripts/Configure-TiaOpenness.ps1",
            "scripts/Package-TiaMcpRelease.ps1"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "缺少必要文件: $path"
            }
          }
          Write-Host "检查通过。"
