name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: 发布前离线验证
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: 还原并运行离线测试
        shell: pwsh
        run: |
          dotnet restore .\tests\TiaMcpServer.Tests\TiaMcpServer.Tests.csproj
          dotnet run --project .\tests\TiaMcpServer.Tests\TiaMcpServer.Tests.csproj -c Release --no-restore

  build-v21:
    name: 构建 TIA Portal V21
    needs: verify
    runs-on: [self-hosted, windows, tia-v21]
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 检查本机 .NET SDK
        shell: powershell
        run: |
          $sdk = dotnet --list-sdks | Where-Object { $_ -match '^8\.' }
          if (-not $sdk) {
            throw "本机 Runner 未安装 .NET SDK 8。请先以管理员身份安装 .NET SDK 8，或为 Runner 服务账户配置可访问的 SDK。"
          }
          dotnet --info
      - name: 还原依赖
        run: dotnet restore .\src\TiaMcpServer\TiaMcpServer.csproj
      - name: 构建 V21 主服务
        run: dotnet build .\src\TiaMcpServer\TiaMcpServer.csproj -c Release --no-restore
      - name: 打包 V21 发布产物
        shell: pwsh
        run: .\scripts\Package-TiaMcpRelease.ps1 -TiaVersion 21
      - name: 上传 V21 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TiaMcpServer-v21-win-x64
          path: release-assets/TiaMcpServer-v21-win-x64.zip
          if-no-files-found: error

  publish:
    name: 创建 GitHub Release
    needs: build-v21
    runs-on: windows-latest
    steps:
      - name: 下载 V21 构建产物
        uses: actions/download-artifact@v4
        with:
          name: TiaMcpServer-v21-win-x64
          path: release-assets
      - name: 创建 Release 并上传压缩包
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip
